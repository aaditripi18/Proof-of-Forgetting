# Every push and pull request: the full test suite on CPU (unit tests,
# determinism, the end-to-end smoke run, and the check that every CSV in
# results/ matches the ledger). The GPU-only slow test runs on Kaggle.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
