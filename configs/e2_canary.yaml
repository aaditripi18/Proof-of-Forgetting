# E2 - does the canary disappear before the client does? (H2)
# Backdoor canaries on the forget client; projected gradient ascent followed
# step by step. Canaries change the training data, so this config has its own
# shadow bank (build it with run_shadows.py on this config for V3).
base: e0_sanity.yaml

experiment: e2_canary

data:
  canary:
    enabled: true

e2:
  epochs: 2        # ascent epochs over the client's training half (incl. canaries)
  every: 4         # checkpoint every 4 ascent steps
  lr: 0.001        # ascent step size; at 0.01 the first run collapsed before step 30,
                   # so the steps where verifiers diverge were never observed
