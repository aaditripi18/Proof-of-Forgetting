[project]
name = "proof-of-forgetting"
version = "0.1.0"
description = "Can a federated client prove it was forgotten? Auditing the verification of federated unlearning."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
medmnist = ["medmnist>=3.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["pof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
